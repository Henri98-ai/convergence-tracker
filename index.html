<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Convergence Tracker — Projet MP</title>
<style>
:root{--bg:#F7F6F3;--surface:#fff;--border:#E4E2DA;--text:#1A1916;--text2:#5A5854;--text3:#9A9790;--red:#C8392B;--red-bg:#FDF1EF;--red-b:#F0C4BE;--amber:#B45309;--amber-bg:#FEFCE8;--amber-b:#F0D88A;--green:#2D6A2D;--green-bg:#F0F7EE;--green-b:#B4D9B4;--blue:#1D5FA4;--blue-bg:#EEF4FB;--r:8px;--sh:0 1px 3px rgba(0,0,0,.07)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh}
.page{max-width:960px;margin:0 auto;padding:2rem 1.5rem}
header{margin-bottom:2rem;display:flex;align-items:center;gap:10px}
.logo-icon{width:36px;height:36px;background:var(--text);border-radius:8px;display:flex;align-items:center;justify-content:center}
.logo-icon svg{width:20px;height:20px;fill:white}
h1{font-size:17px;font-weight:600}
.sub{font-size:12px;color:var(--text3);margin-top:1px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1.25rem;margin-bottom:1.5rem;box-shadow:var(--sh)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
label{display:block;font-size:11px;font-weight:500;color:var(--text2);margin-bottom:4px;letter-spacing:.03em;text-transform:uppercase}
input,select{width:100%;height:36px;padding:0 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;background:var(--bg);color:var(--text);outline:none;font-family:inherit}
input:focus,select:focus{border-color:var(--blue)}
input[type=password]{font-family:monospace;letter-spacing:.05em}
input[type=date]{padding:0 8px}
.info-box{font-size:11px;color:var(--text2);background:var(--blue-bg);border:1px solid #C8DCF2;border-radius:6px;padding:8px 10px;margin-bottom:12px}
.info-box strong{color:var(--blue)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{height:36px;padding:0 16px;border-radius:6px;font-size:13px;font-weight:500;cursor:pointer;border:none;font-family:inherit;white-space:nowrap}
.btn-p{background:var(--text);color:#fff}.btn-p:hover{opacity:.85}
.btn-s{background:var(--bg);color:var(--text);border:1px solid var(--border)}.btn-s:hover{background:var(--border)}
.status{font-size:12px;color:var(--text3);display:flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:var(--border);flex-shrink:0}
.dot.ok{background:var(--green)}.dot.err{background:var(--red)}.dot.loading{background:var(--amber);animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.hidden{display:none !important}
.sprint-row{display:flex;gap:10px;align-items:flex-end;flex-wrap:wrap}
.sprint-row .f{flex:1;min-width:180px}
.prog-wrap{margin-top:10px}
.prog{height:4px;background:var(--border);border-radius:2px;overflow:hidden}
.prog-fill{height:100%;background:var(--blue);border-radius:2px;transition:width .2s}
.prog-label{font-size:11px;color:var(--text3);margin-top:4px;text-align:center}
.sprint-name{font-size:20px;font-weight:600;letter-spacing:-.02em;margin-bottom:2px}
.sprint-sub{font-size:12px;color:var(--text3);margin-bottom:1.5rem}
.metrics{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;margin-bottom:1.5rem}
@media(max-width:800px){.metrics{grid-template-columns:repeat(3,1fr)}}@media(max-width:500px){.metrics{grid-template-columns:repeat(2,1fr)}}
.metric{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:14px 16px;box-shadow:var(--sh)}
.metric-l{font-size:10px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--text3);margin-bottom:6px}
.metric-v{font-size:26px;font-weight:700;letter-spacing:-.03em}
.metric-s{font-size:11px;color:var(--text3);margin-top:2px}
.va{color:var(--amber)}
.filter-bar{background:var(--surface);border:1px solid var(--border);border-radius:var(--r);padding:1rem 1.25rem;margin-bottom:1.5rem;box-shadow:var(--sh)}
.filter-title{font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;margin-bottom:10px}
.filter-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:10px}
@media(max-width:700px){.filter-grid{grid-template-columns:repeat(2,1fr)}}
.active-filters{display:flex;gap:6px;flex-wrap:wrap}
.ftag{font-size:11px;padding:3px 10px;border-radius:20px;background:var(--blue-bg);color:var(--blue);border:1px solid #C8DCF2;display:flex;align-items:center;gap:6px}
.ftag button{background:none;border:none;cursor:pointer;color:var(--blue);font-size:13px;line-height:1;padding:0}
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:1rem}
.tab{padding:8px 14px;font-size:13px;font-weight:500;color:var(--text3);cursor:pointer;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.active{color:var(--text);border-bottom-color:var(--text)}
.ticket-list{display:flex;flex-direction:column;gap:8px}
.team-separator{padding:6px 0 4px;font-size:11px;font-weight:600;color:var(--text2);text-transform:uppercase;letter-spacing:.05em;border-bottom:1px solid var(--border);margin-bottom:4px;display:flex;align-items:center;gap:8px}
.team-sep-dot{width:10px;height:10px;border-radius:50%;flex-shrink:0}
.team-sep-count{font-size:10px;font-weight:400;color:var(--text3);margin-left:auto}
.tcard{background:var(--surface);border:1px solid var(--border);border-left-width:3px;border-radius:var(--r);padding:12px 14px;box-shadow:var(--sh)}
.tcard.arrived{border-left-color:var(--blue)}.tcard.notyet{border-left-color:var(--border)}
.tt{display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap}
.tid{font-size:11px;font-weight:600;color:var(--blue);font-family:monospace;flex-shrink:0}
.ttitle{font-size:13px;font-weight:500;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rbadge{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:500;flex-shrink:0}
.r-arr{background:var(--blue-bg);color:var(--blue);border:1px solid #C8DCF2}
.r-not{background:var(--bg);color:var(--text3);border:1px solid var(--border)}
.type-badge{font-size:10px;padding:2px 7px;border-radius:4px;font-weight:500;flex-shrink:0;background:#EEE;color:#555}
.type-us{background:#E8F0FE;color:#1A56DB}
.type-bug{background:var(--red-bg);color:var(--red)}
.tm{display:flex;gap:10px;font-size:11px;color:var(--text3);flex-wrap:wrap;align-items:center}
.day-pill{font-size:11px;padding:2px 8px;border-radius:20px;font-weight:600;margin-left:auto;background:var(--blue-bg);color:var(--blue)}
.rfrow{display:flex;justify-content:space-between;align-items:center;margin-bottom:1rem;flex-wrap:wrap;gap:8px}
.rfinfo{font-size:11px;color:var(--text3)}
.sort-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.sort-label{font-size:11px;color:var(--text3)}
.sort-btn{font-size:11px;padding:3px 10px;border-radius:20px;border:1px solid var(--border);background:var(--bg);cursor:pointer;color:var(--text2)}
.sort-btn.active{background:var(--text);color:white;border-color:var(--text)}
.empty{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
.metric{cursor:pointer;transition:box-shadow .15s}
.metric:hover{box-shadow:0 0 0 2px var(--blue)}
.modal-overlay{position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,.35);z-index:100;display:flex;align-items:flex-start;justify-content:center;padding:2rem 1rem;overflow-y:auto}
.modal{background:var(--surface);border-radius:var(--r);width:100%;max-width:720px;box-shadow:0 8px 32px rgba(0,0,0,.18);overflow:hidden}
.modal-header{padding:14px 18px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.modal-title{font-size:14px;font-weight:600}
.modal-close{background:none;border:none;font-size:20px;cursor:pointer;color:var(--text3);line-height:1;padding:0}
.modal-body{padding:14px 18px;max-height:70vh;overflow-y:auto}
.modal-count{font-size:11px;color:var(--text3);margin-bottom:12px}
.lmsg{text-align:center;padding:3rem;color:var(--text3);font-size:13px}
</style>
</head>
<body>
<div class="page">

<header>
  <div class="logo-icon"><svg viewBox="0 0 24 24"><path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/></svg></div>
  <div><h1>Convergence Tracker</h1><div class="sub">Projet MP — isagri.atlassian.net</div></div>
</header>

<div class="card">
  <div class="grid2">
    <div><label>Email Atlassian</label><input type="email" id="email" placeholder="prenom.nom@isagri.com"></div>
    <div>
        <label>Token API</label>
        <input type="password" id="token" placeholder="Collez votre token ici">
        <div style="margin-top:6px;display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="rememberToken" style="width:14px;height:14px;margin:0;cursor:pointer">
          <label for="rememberToken" style="font-size:11px;color:var(--text3);text-transform:none;letter-spacing:0;cursor:pointer;margin:0">Se souvenir du token sur cet appareil</label>
        </div>
      </div>
      <div>
        <label>Mot de passe app</label>
        <input type="password" id="appPassword" placeholder="Mot de passe partagé" autocomplete="off">
        <div style="margin-top:6px;display:flex;align-items:center;gap:6px">
          <input type="checkbox" id="rememberPassword" style="width:14px;height:14px;margin:0;cursor:pointer">
          <label for="rememberPassword" style="font-size:11px;color:var(--text3);text-transform:none;letter-spacing:0;cursor:pointer;margin:0">Se souvenir du mot de passe</label>
        </div>
      </div>
  </div>
  <div class="grid3">
    <div><label>Colonne "à tester"</label><input type="text" id="colTester" value="6 - A tester en dev"></div>
    <div><label>Vitesse de chargement</label>
      <select id="batchSize">
        <option value="3">Lente (réseau instable)</option>
        <option value="5">Normale</option>
        <option value="8">Rapide</option>
        <option value="12" selected>Très rapide (recommandé)</option>
      </select>
    </div>
    <div><label>&nbsp;</label><button class="btn btn-p" onclick="connect()" style="width:100%">Charger les sprints →</button></div>
  </div>
  <div class="info-box"><strong>ℹ️ Proxy CORS :</strong> Les appels Jira transitent par corsproxy.io par petits groupes pour éviter le rate limiting. Votre token reste en local.</div>
  <div class="row"><div class="status"><div class="dot" id="dot"></div><span id="stxt">Non connecté</span></div></div>
</div>

<div class="card hidden" id="sprintBar">
  <div class="sprint-row">
    <div class="f"><label>Sprint à analyser</label><select id="sprintSel"></select></div>
    <div><label>&nbsp;</label><button class="btn btn-p" onclick="loadSprint()">Analyser →</button></div>
    <div><label>&nbsp;</label><button class="btn btn-s" onclick="toggleAR()" id="arBtn">⟳ Auto-refresh (5 min)</button></div>
  </div>
  <div class="prog-wrap hidden" id="progWrap">
    <div class="prog"><div class="prog-fill" id="progFill" style="width:0%"></div></div>
    <div class="prog-label" id="progLabel">Chargement...</div>
  </div>
</div>

<div class="hidden" id="main">
  <div class="sprint-name" id="sName"></div>
  <div class="sprint-sub" id="sSub"></div>

  <div class="filter-bar">
    <div class="filter-title">Filtres</div>
    <div class="filter-grid">
      <div>
        <label>Type de ticket</label>
        <select id="filterType" onchange="applyFilters()">
          <option value="all">Tous les types</option>
          <option value="us">User Stories uniquement</option>
          <option value="bug">Bugs uniquement</option>
        </select>
      </div>
      <div>
        <label>Équipe (Team)</label>
        <select id="filterTeam" onchange="applyFilters()">
          <option value="all">Toutes les équipes</option>
        </select>
      </div>
      <div>
        <label>Arrivée en test après le</label>
        <input type="date" id="filterDate" onchange="applyFilters()">
      </div>
      <div>
        <label>Priorité</label>
        <select id="filterPriority" onchange="applyFilters()">
          <option value="all">Toutes les priorités</option>
          <option value="Critique">Critique</option>
          <option value="Elevé">Élevé</option>
          <option value="Moyen">Moyen</option>
          <option value="Faible">Faible</option>
        </select>
      </div>

    </div>
    <div style="display:flex;justify-content:flex-end;margin-bottom:8px">
      <button class="btn btn-s" onclick="resetFilters()">✕ Réinitialiser les filtres</button>
    </div>
    <div class="active-filters" id="activeTags"></div>
  </div>

  <div class="metrics" id="metrics"></div>

  <div class="tabs">
    <div class="tab active" onclick="switchTab(this,'arrived')">Arrivés à tester <span id="lb1"></span></div>
    <div class="tab" onclick="switchTab(this,'notyet')">Pas encore à tester <span id="lb2"></span></div>
  </div>

  <div class="rfrow">
    <div class="sort-row">
      <span class="sort-label">Trier par :</span>
      <button class="sort-btn active" onclick="setSort(this,'team')">Équipe</button>
      <button class="sort-btn" onclick="setSort(this,'date')">Date d'arrivée</button>
      <button class="sort-btn" onclick="setSort(this,'delay')">Délai (jours)</button>
      <button class="sort-btn" onclick="setSort(this,'id')">ID</button>
    </div>
    <div class="rfinfo" id="rfInfo"></div>
  </div>
  <div class="ticket-list" id="tList"></div>
</div>

</div>

<!-- Modale détail métrique -->
<div class="modal-overlay hidden" id="modalOverlay" onclick="closeModal(event)">
  <div class="modal">
    <div class="modal-header">
      <span class="modal-title" id="modalTitle"></span>
      <div style="display:flex;align-items:center;gap:10px">
        <div id="modalRevueWrap" class="hidden" style="display:flex;align-items:center;gap:10px;flex-wrap:wrap">
          <div style="display:flex;align-items:center;gap:6px">
            <label style="font-size:11px;color:var(--text2);white-space:nowrap">Équipe :</label>
            <select id="modalTeamFilter" onchange="showModal(currentModalType)" style="height:30px;font-size:12px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg)">
              <option value="all">Toutes</option>
            </select>
          </div>
          <div style="display:flex;align-items:center;gap:6px">
            <label style="font-size:11px;color:var(--text2);white-space:nowrap">Revue commando :</label>
            <select id="modalRevueFilter" onchange="showModal(currentModalType)" style="height:30px;font-size:12px;padding:0 8px;border:1px solid var(--border);border-radius:6px;background:var(--bg)">
              <option value="all">Toutes</option>
              <option value="Validé">Validé</option>
              <option value="Vide">Vide</option>
            </select>
          </div>
        </div>
        <button class="modal-close" onclick="document.getElementById('modalOverlay').classList.add('hidden')">✕</button>
      </div>
    </div>
    <div class="modal-body">
      <div class="modal-count" id="modalCount"></div>
      <div class="ticket-list" id="modalList"></div>
    </div>
  </div>
</div>

<script>
const JIRA='https://isagri.atlassian.net';
const BOARD=127;
const PROXY=''; // Serveur local
// Détecter automatiquement l'URL du serveur (local ou Render)
const LOCAL=window.location.origin==='http://localhost:5000'||window.location.hostname==='localhost'
  ? 'http://localhost:5000'
  : window.location.origin;
let useLocal=true; // toujours utiliser le serveur (local ou Render)
const US_TYPES=['user story'];
const BUG_TYPES=['bug','bogue','défaut','incident','anomalie'];
const TEAM_COLORS=['#1D5FA4','#2D6A2D','#B45309','#C8392B','#6B21A8','#0E7490','#92400E','#166534','#9D174D','#1E3A5F'];
let auth='',sprintStart=null,sprintEnd=null,allT=[],timer=null,isAR=false,curTab='arrived',curSort='team',teamColorMap={},revueFieldId=null;
let cache={}; // cache[sprintId][issueKey] = {delay, ad, ...}

function show(id){document.getElementById(id).classList.remove('hidden');}
function hide(id){document.getElementById(id).classList.add('hidden');}
function setStatus(s,m){document.getElementById('dot').className='dot '+(s||'');document.getElementById('stxt').textContent=m;}
function sleep(ms){return new Promise(r=>setTimeout(r,ms));}

// Traitement par lots pour éviter le 429
async function processInBatches(items, fn, batchSize=5, delayMs=300){
  const results=[];
  for(let i=0;i<items.length;i+=batchSize){
    const batch=items.slice(i,i+batchSize);
    const batchResults=await Promise.all(batch.map(fn));
    results.push(...batchResults);
    if(i+batchSize<items.length) await sleep(delayMs);
  }
  return results;
}

async function api(path,params,retries=2){
  for(let attempt=0;attempt<=retries;attempt++){
    try{
      let r;
      if(useLocal){
        // Via serveur (local ou Render)
        const query=params?new URLSearchParams(params).toString():'';
        const pwd=document.getElementById('appPassword')?.value||localStorage.getItem('app_password')||'';
        const url=LOCAL+'/jira?path='+encodeURIComponent(path)+(query?'&query='+encodeURIComponent(query):'')+'&pwd='+encodeURIComponent(pwd);
        r=await fetch(url,{headers:{'Authorization':auth,'X-App-Password':pwd,'Accept':'application/json'}});
      } else {
        // Via proxy public
        let url=JIRA+path;
        if(params)url+='?'+new URLSearchParams(params);
        r=await fetch('https://corsproxy.io/?url='+encodeURIComponent(url),{
          headers:{'Authorization':auth,'Accept':'application/json','x-requested-with':'XMLHttpRequest'}
        });
      }
      if(r.status===429){await sleep(1500*(attempt+1));continue;}
      if(!r.ok)throw new Error(r.status+' '+r.statusText);
      return await r.json();
    }catch(e){
      if(attempt===retries)throw e;
      await sleep(800);
    }
  }
}

async function tryLocalServer(){
  try{
    const r=await fetch(LOCAL+'/auth?token='+encodeURIComponent(btoa(document.getElementById('email').value+':'+document.getElementById('token').value)),{method:'GET'});
    if(r.ok){useLocal=true;return true;}
  }catch{}
  return false;
}

async function findTeamField(){
  try{
    const fields=await api('/rest/api/2/field');
    const tf=fields.find(f=>f.name.toLowerCase()==='team'||f.name.toLowerCase()==='équipe'||f.name.toLowerCase()==='squad');
    const rf=fields.find(f=>f.name.toLowerCase()==='revue commando');
    if(rf)revueFieldId=rf.id;
    return tf?tf.id:null;
  }catch{return null;}
}

async function connect(){
  const em=document.getElementById('email').value.trim();
  const tk=document.getElementById('token').value.trim();
  if(!em||!tk){setStatus('err','Email et token requis');return;}
  auth='Basic '+btoa(em+':'+tk);
  setStatus('loading','Connexion...');
  // Connexion via serveur (local ou Render)
  try{
    const d=await api('/rest/agile/1.0/board/'+BOARD+'/sprint',{state:'active,closed',maxResults:20});
    const sp=(d.values||[]).reverse();
    document.getElementById('sprintSel').innerHTML=sp.map(s=>`<option value="${s.id}" data-start="${s.startDate||''}" data-end="${s.endDate||''}" data-name="${s.name}">${s.name} (${s.state})</option>`).join('');
    show('sprintBar');
    setStatus('ok','Connecté — '+sp.length+' sprints');
    localStorage.setItem('jira_email',em);
    if(document.getElementById('rememberToken').checked){
      localStorage.setItem('jira_token',tk);
    }
  }catch(e){setStatus('err','Erreur : '+e.message);}
}

async function loadSprint(){
  const sel=document.getElementById('sprintSel');
  const opt=sel.selectedOptions[0];
  const id=sel.value;
  sprintStart=opt.dataset.start?new Date(opt.dataset.start):null;
  sprintEnd=opt.dataset.end?new Date(opt.dataset.end):null;
  const col=document.getElementById('colTester').value.trim();
  const batchSize=parseInt(document.getElementById('batchSize').value);

  // Initialiser le cache pour ce sprint si pas encore fait
  if(!cache[id])cache[id]={};
  const sprintCache=cache[id];
  show('main');
  document.getElementById('sName').textContent=opt.dataset.name;
  document.getElementById('sSub').textContent='Début : '+fd(opt.dataset.start)+' · Fin : '+fd(opt.dataset.end)+' · Colonne : "'+col+'"';
  document.getElementById('tList').innerHTML='<div class="lmsg">⏳ Initialisation...</div>';
  document.getElementById('metrics').innerHTML='';
  document.getElementById('filterDate').value='';
  document.getElementById('filterType').value='all';
  document.getElementById('filterPriority').value='all';
  document.getElementById('filterTeam').innerHTML='<option value="all">Toutes les équipes</option>';
  document.getElementById('activeTags').innerHTML='';
  show('progWrap');
  document.getElementById('progFill').style.width='2%';
  document.getElementById('progLabel').textContent='Recherche du champ Team...';
  setStatus('loading','Chargement...');

  const teamFieldId=await findTeamField();
  // Filtrer uniquement les User Stories via JQL pour aller plus vite
    const jqlFilter='issuetype="User Story"';
    const fields='summary,status,priority,assignee,issuetype'+(teamFieldId?','+teamFieldId:'')+(revueFieldId?','+revueFieldId:'');

  document.getElementById('progLabel').textContent='Chargement de la liste des tickets...';

  try{
    // Récupérer TOUS les tickets du sprint via JQL (inclut les sous-tickets)
    let issues=[];
    let startAt=0;
    const pageSize=50;
    // Endpoint agile avec pagination complète
    while(true){
      const pageData=await api('/rest/agile/1.0/sprint/'+id+'/issue',{
        maxResults:pageSize,
        startAt:startAt,
        fields:fields,
        jql:jqlFilter
      });
      const page=pageData.issues||[];
      issues.push(...page);
      document.getElementById('progLabel').textContent='Chargement des tickets... ('+issues.length+'/'+(pageData.total||'?')+')';
      if(issues.length>=(pageData.total||0)||page.length<pageSize)break;
      startAt+=pageSize;
      await sleep(300);
    }
    const total=issues.length;
    let done=0;
    const colLower=col.toLowerCase().replace(/^\d+ - /,'');

    document.getElementById('progLabel').textContent='Analyse des transitions (0/'+total+')...';

    const enriched=await processInBatches(issues, async issue=>{
      try{
        const key=issue.key;
        const cl=await api('/rest/api/2/issue/'+key+'/changelog',{maxResults:100,startAt:0});
        const tr=[];
        let clTotal=cl.total||0;
        for(const h of cl.values||[])
          for(const it of h.items||[])
            if(it.field==='status')tr.push({to:it.toString,date:h.created});
        // Paginer si plus de 100 entrées dans le changelog
        let clStart=100;
        while(tr.length<clTotal && clStart<clTotal){
          const cl2=await api('/rest/api/2/issue/'+key+'/changelog',{maxResults:100,startAt:clStart});
          for(const h of cl2.values||[])
            for(const it of h.items||[])
              if(it.field==='status')tr.push({to:it.toString,date:h.created});
          clStart+=100;
        }
        const arr=tr.find(t=>t.to.toLowerCase()===col.toLowerCase()||t.to.toLowerCase().includes(colLower));

        const ad=arr?new Date(arr.date):null;
        const delay=ad&&sprintStart?Math.round((ad-sprintStart)/86400000*10)/10:null;
        const typeName=(issue.fields.issuetype?.name||'').toLowerCase().trim();
        let typeCategory='other';
        if(US_TYPES.some(t=>typeName===t))typeCategory='us';
        else if(BUG_TYPES.some(t=>typeName===t||typeName.includes(t)))typeCategory='bug';
        let team='Sans équipe';
        if(teamFieldId&&issue.fields[teamFieldId]){
          const tf=issue.fields[teamFieldId];
          if(typeof tf==='string')team=tf;
          else if(tf?.name)team=tf.name;
          else if(tf?.value)team=tf.value;
          else if(Array.isArray(tf)&&tf[0])team=tf[0].name||tf[0].value||String(tf[0]);
        }
        let revueCommando='';
        if(revueFieldId&&issue.fields[revueFieldId]){
          const rv=issue.fields[revueFieldId];
          if(typeof rv==='string')revueCommando=rv;
          else if(rv?.value)revueCommando=rv.value;
          else if(rv?.name)revueCommando=rv.name;
        }
        done++;
        const pct=Math.round(done/total*100);
        document.getElementById('progFill').style.width=pct+'%';
        document.getElementById('progLabel').textContent='Analyse des transitions ('+done+'/'+total+')...';
        return{id:issue.key,title:issue.fields.summary,status:issue.fields.status?.name||'?',assignee:issue.fields.assignee?.displayName||'—',priority:issue.fields.priority?.name||'—',issueType:issue.fields.issuetype?.name||'?',typeCategory,team,revueCommando,ad,delay};
      }catch{
        done++;
        return{id:issue.key,title:issue.fields.summary,status:'?',assignee:'—',priority:'—',issueType:'?',typeCategory:'other',team:'Sans équipe',revueCommando:'',ad:null,delay:null};
      }
    }, batchSize, 300);

    allT=enriched;
    const teams=[...new Set(enriched.map(t=>t.team))].sort();
    teamColorMap={};
    teams.filter(t=>t!=='Sans équipe').forEach((t,i)=>teamColorMap[t]=TEAM_COLORS[i%TEAM_COLORS.length]);
    teamColorMap['Sans équipe']='#9A9790';

    const teamSel=document.getElementById('filterTeam');
    teamSel.innerHTML='<option value="all">Toutes les équipes ('+teams.filter(t=>t!=='Sans équipe').length+')</option>'+
      teams.map(t=>`<option value="${t}">${t}</option>`).join('');

    hide('progWrap');
    applyFilters();
    const cachedCount=Object.keys(sprintCache).length-enriched.length;
    const cacheInfo=cachedCount>0?' — ⚡ '+cachedCount+' depuis cache':'';
    setStatus('ok','À jour'+cacheInfo+(teamFieldId?'':' — champ Team non trouvé'));
    document.getElementById('rfInfo').textContent='Mis à jour : '+new Date().toLocaleTimeString('fr-FR');
  }catch(e){
    setStatus('err','Erreur : '+e.message);
    hide('progWrap');
    document.getElementById('tList').innerHTML='<div class="empty">❌ '+e.message+'</div>';
  }
}

function getFiltered(){
  const ft=document.getElementById('filterType').value;
  const fteam=document.getElementById('filterTeam').value;
  const fdv=document.getElementById('filterDate').value;
  const fp=document.getElementById('filterPriority').value;
  const fd2=fdv?new Date(fdv):null;
  return allT.filter(t=>{
    if(ft==='us'&&t.typeCategory!=='us')return false;
    if(ft==='bug'&&t.typeCategory!=='bug')return false;
    if(fteam!=='all'&&t.team!==fteam)return false;
    if(fd2&&(!t.ad||t.ad<fd2))return false;
    if(fp!=='all'&&t.priority!==fp)return false;
    return true;
  });
}

function applyFilters(){
  if(!allT.length)return;
  const ft=document.getElementById('filterType').value;
  const fteam=document.getElementById('filterTeam').value;
  const fdv=document.getElementById('filterDate').value;
  const fp=document.getElementById('filterPriority').value;
  const tags=[];
  if(ft==='us')tags.push({label:'User Stories uniquement',key:'type'});
  if(ft==='bug')tags.push({label:'Bugs uniquement',key:'type'});
  if(fteam!=='all')tags.push({label:'Équipe : '+fteam,key:'team'});
  if(fdv)tags.push({label:'Arrivée après le '+fd(fdv),key:'date'});
  if(fp!=='all')tags.push({label:'Priorité : '+fp,key:'priority'});
  document.getElementById('activeTags').innerHTML=tags.map(t=>
    `<div class="ftag">${t.label}<button onclick="clearFilter('${t.key}')">✕</button></div>`
  ).join('');
  render(getFiltered());
}

function clearFilter(key){
  if(key==='type')document.getElementById('filterType').value='all';
  if(key==='team')document.getElementById('filterTeam').value='all';
  if(key==='date')document.getElementById('filterDate').value='';
  if(key==='priority')document.getElementById('filterPriority').value='all';
  applyFilters();
}
function resetFilters(){
  document.getElementById('filterType').value='all';
  document.getElementById('filterTeam').value='all';
  document.getElementById('filterDate').value='';
  document.getElementById('filterPriority').value='all';
  applyFilters();
}

function render(e){
  const arrived=e.filter(t=>t.ad!==null);
  const notyet=e.filter(t=>t.ad===null);
  const avg=arrived.length?(arrived.reduce((s,t)=>s+t.delay,0)/arrived.length).toFixed(1):'—';
  const last=arrived.length?new Date(Math.max(...arrived.map(t=>t.ad.getTime()))):null;
    // Compter les tickets dans chaque colonne clé (sur TOUS les tickets du sprint)
  const colTest=document.getElementById('colTester').value.trim();
  const inTester=allT.filter(t=>t.status.toLowerCase()===colTest.toLowerCase()).length;
  const inProd=allT.filter(t=>t.status==='9 - A LIVRER EN PROD').length;
  const m1='<div class="metric" onclick="showModal(\'selected\')"><div class="metric-l">Tickets sélectionnés</div><div class="metric-v">'+e.length+'</div><div class="metric-s">cliquer pour voir</div></div>';
  const m2='<div class="metric" onclick="showModal(\'arrived\')"><div class="metric-l">Arrivés à tester</div><div class="metric-v" style="color:var(--blue)">'+arrived.length+'</div><div class="metric-s">cliquer pour voir</div></div>';

  const inTesterSansRevue=allT.filter(t=>t.status.toLowerCase()===colTest.toLowerCase()&&(!t.revueCommando||t.revueCommando==='Vide')).length;
  const m4='<div class="metric" style="border-color:#C8DCF2;cursor:pointer" onclick="showModal(\'inTester\')"><div class="metric-l" style="color:var(--blue)">📋 A tester en dev</div><div class="metric-v" style="color:var(--blue)">'+inTester+'</div><div class="metric-s"><span style="color:var(--red);font-weight:500">'+inTesterSansRevue+' sans revue commando</span></div></div>';
  const inProdSansRevue=allT.filter(t=>t.status==='9 - A LIVRER EN PROD'&&(!t.revueCommando||t.revueCommando==='Vide')).length;
  const m5='<div class="metric" style="border-color:#F0D88A" onclick="showModal(\'inProd\')"><div class="metric-l" style="color:var(--amber)">🚀 A livrer en prod</div><div class="metric-v" style="color:var(--amber)">'+inProd+'</div><div class="metric-s">'+inProdSansRevue+' sans revue commando</span></div></div>';
  const revueValide=allT.filter(t=>t.revueCommando==='Validé').length;
  const m6='<div class="metric" style="border-color:var(--green-b);cursor:pointer" onclick="showModal(\'revueValide\')"><div class="metric-l" style="color:var(--green)">✓ Revue commando</div><div class="metric-v" style="color:var(--green)">'+revueValide+'</div><div class="metric-s">validées sur '+allT.length+' tickets</div></div>';
  document.getElementById('metrics').innerHTML=m1+m2+m4+m5+m6;
  document.getElementById('lb1').textContent='('+arrived.length+')';
  document.getElementById('lb2').textContent='('+notyet.length+')';
  renderTab(curTab,e);
}

function switchTab(el,tab){
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  el.classList.add('active');curTab=tab;renderTab(tab,getFiltered());
}
function setSort(el,sort){
  document.querySelectorAll('.sort-btn').forEach(b=>b.classList.remove('active'));
  el.classList.add('active');curSort=sort;renderTab(curTab,getFiltered());
}

function sortList(list){
  const s=[...list];
  if(curSort==='team')s.sort((a,b)=>a.team.localeCompare(b.team)||(a.ad?.getTime()??0)-(b.ad?.getTime()??0));
  else if(curSort==='date')s.sort((a,b)=>(b.ad?.getTime()??0)-(a.ad?.getTime()??0));
  else if(curSort==='delay')s.sort((a,b)=>(b.delay??-1)-(a.delay??-1));
  else s.sort((a,b)=>a.id.localeCompare(b.id));
  return s;
}

function renderTab(tab,e){
  const list=tab==='arrived'?e.filter(t=>t.ad!==null):e.filter(t=>t.ad===null);
  const sorted=sortList(list);
  if(!sorted.length){document.getElementById('tList').innerHTML='<div class="empty">Aucun ticket dans cette catégorie</div>';return;}
  let html='';
  if(curSort==='team'){
    const groups={};
    sorted.forEach(t=>{if(!groups[t.team])groups[t.team]=[];groups[t.team].push(t);});
    Object.entries(groups).forEach(([team,tickets])=>{
      const color=teamColorMap[team]||'#9A9790';
      html+=`<div class="team-separator"><div class="team-sep-dot" style="background:${color}"></div>${team}<span class="team-sep-count">${tickets.length} ticket${tickets.length>1?'s':''}</span></div>`;
      tickets.forEach(t=>{html+=cardHtml(t);});
    });
  }else{
    sorted.forEach(t=>{html+=cardHtml(t);});
  }
  document.getElementById('tList').innerHTML=html;
}

function cardHtml(t){
  const arrived=t.ad!==null;
  const typeCls=t.typeCategory==='us'?'type-us':t.typeCategory==='bug'?'type-bug':'';
  const color=teamColorMap[t.team]||'#9A9790';
  return`<div class="tcard ${arrived?'arrived':'notyet'}">
    <div class="tt">
      <a class="tid" href="${JIRA}/browse/${t.id}" target="_blank" style="text-decoration:none">${t.id} ↗</a>
      <span class="type-badge ${typeCls}">${t.issueType}</span>
      <span class="ttitle" title="${t.title}">${t.title}</span>
      <span class="rbadge ${arrived?'r-arr':'r-not'}">${arrived?'Arrivé à tester':'Pas encore prêt'}</span>
    </div>
    <div class="tm">
      <span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:${color};display:inline-block"></span>${t.team}</span>
      <span>👤 ${t.assignee}</span>
      ${t.ad?`<span>📅 <strong>${fd(t.ad.toISOString())}</strong></span>`:'<span>📅 Pas encore à tester</span>'}
      ${t.delay!==null?`<span class="day-pill">J+${t.delay}</span>`:''}
      <span>📌 ${t.status}</span>
    </div>
  </div>`;
}

function showModal(type){
  const filtered=getFiltered();
  let tickets=[];
  let title='';
  const colTest=document.getElementById('colTester').value.trim();
  if(type==='selected'){tickets=filtered;title='Tickets sélectionnés ('+filtered.length+')';}
  else if(type==='arrived'){tickets=filtered.filter(t=>t.ad!==null);title='Arrivés à tester ('+tickets.length+')';}
  else if(type==='inTester'){
    const revueFilter=document.getElementById('modalRevueFilter')?.value||'all';
    const teamFilter=document.getElementById('modalTeamFilter')?.value||'all';
    let base=allT.filter(t=>t.status.toLowerCase()===colTest.toLowerCase());
    if(teamFilter!=='all')base=base.filter(t=>t.team===teamFilter);
    if(revueFilter==='Validé')base=base.filter(t=>t.revueCommando==='Validé');
    if(revueFilter==='Vide')base=base.filter(t=>!t.revueCommando||t.revueCommando==='Vide');
    tickets=base;
    title='Actuellement en "'+colTest+'" ('+tickets.length+')';
  }
  else if(type==='inProd'){
    const revueFilter=document.getElementById('modalRevueFilter')?.value||'all';
    let base=allT.filter(t=>t.status==='9 - A LIVRER EN PROD');
    if(revueFilter==='Validé')base=base.filter(t=>t.revueCommando==='Validé');
    if(revueFilter==='Vide')base=base.filter(t=>!t.revueCommando||t.revueCommando==='Vide');
    tickets=base;
    title='Actuellement en "A livrer en prod" ('+tickets.length+')';
  }
  else if(type==='revueValide'){
    tickets=allT.filter(t=>t.revueCommando==='Validé');
    title='Revue commando validée ('+tickets.length+')';
  }

  currentModalType=type;
  // Afficher les filtres uniquement pour inTester et inProd
  const revueWrap=document.getElementById('modalRevueWrap');
  if(type==='inTester'||type==='inProd'){
    revueWrap.classList.remove('hidden');
    revueWrap.style.display='flex';
    // Peupler le select équipe
    const teamSel=document.getElementById('modalTeamFilter');
    const teams=[...new Set(allT.filter(t=>t.status===(type==='inTester'?document.getElementById('colTester').value.trim():'9 - A LIVRER EN PROD')).map(t=>t.team))].sort();
    const currentTeam=teamSel.value;
    teamSel.innerHTML='<option value="all">Toutes ('+teams.length+')</option>'+teams.map(t=>'<option value="'+t+'"'+(t===currentTeam?' selected':'')+'>'+t+'</option>').join('');
  } else {
    revueWrap.classList.add('hidden');
    revueWrap.style.display='none';
    if(document.getElementById('modalRevueFilter'))document.getElementById('modalRevueFilter').value='all';
    if(document.getElementById('modalTeamFilter'))document.getElementById('modalTeamFilter').value='all';
  }
  document.getElementById('modalTitle').textContent=title;
  document.getElementById('modalCount').textContent=tickets.length+' ticket'+(tickets.length>1?'s':'');

  const sorted=[...tickets].sort((a,b)=>(a.team||'').localeCompare(b.team||'')||(a.id.localeCompare(b.id)));
  const color=t=>teamColorMap[t.team]||'#9A9790';
  document.getElementById('modalList').innerHTML=sorted.length?sorted.map(t=>{
    const typeCls=t.typeCategory==='us'?'type-us':t.typeCategory==='bug'?'type-bug':'';
    return '<div class="tcard arrived" style="margin-bottom:6px">'+
      '<div class="tt">'+
      '<a class="tid" href="'+JIRA+'/browse/'+t.id+'" target="_blank" style="text-decoration:none">'+t.id+' ↗</a>'+
      '<span class="type-badge '+typeCls+'">'+t.issueType+'</span>'+
      '<span class="ttitle" title="'+t.title+'">'+t.title+'</span>'+
      '</div>'+
      '<div class="tm">'+
      '<span style="display:flex;align-items:center;gap:4px"><span style="width:7px;height:7px;border-radius:50%;background:'+color(t)+';display:inline-block"></span>'+t.team+'</span>'+
      '<span>👤 '+t.assignee+'</span>'+
      (t.ad?'<span>📅 '+fd(t.ad.toISOString())+'</span>':'')+
      (t.delay!==null?'<span class="day-pill">J+'+t.delay+'</span>':'')+
      '<span>📌 '+t.status+'</span>'+
      (t.revueCommando&&t.revueCommando==='Validé'?'<span style="font-size:10px;padding:2px 7px;border-radius:4px;background:#F0F7EE;color:#2D6A2D;border:1px solid #B4D9B4;font-weight:500">✓ Revue commando</span>':'')+
      '</div>'+
      '</div>';
  }).join(''):'<div class="empty">Aucun ticket</div>';

  document.getElementById('modalOverlay').classList.remove('hidden');
}

function closeModal(e){
  if(e.target===document.getElementById('modalOverlay')){
    document.getElementById('modalOverlay').classList.add('hidden');
  }
}

let currentModalType='';

function toggleAR(){
  const btn=document.getElementById('arBtn');
  if(isAR){clearInterval(timer);isAR=false;btn.textContent='⟳ Auto-refresh (5 min)';btn.style.background='';}
  else{isAR=true;btn.textContent='⏹ Arrêter';btn.style.background='var(--green-bg)';loadSprint();timer=setInterval(loadSprint,5*60*1000);}
}

function fd(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short',year:'numeric'});}
function fdShort(iso){if(!iso)return'—';return new Date(iso).toLocaleDateString('fr-FR',{day:'2-digit',month:'short'});}

window.addEventListener('load',()=>{
  const em=localStorage.getItem('jira_email');
  if(em)document.getElementById('email').value=em;
  const tk=localStorage.getItem('jira_token');
  if(tk){document.getElementById('token').value=tk;document.getElementById('rememberToken').checked=true;}
  const pwd=localStorage.getItem('app_password');
  if(pwd){document.getElementById('appPassword').value=pwd;document.getElementById('rememberPassword').checked=true;}
});
document.getElementById('appPassword')?.addEventListener('change',()=>{
  if(document.getElementById('rememberPassword').checked)
    localStorage.setItem('app_password',document.getElementById('appPassword').value);
});
document.getElementById('rememberPassword')?.addEventListener('change',function(){
  if(!this.checked)localStorage.removeItem('app_password');
  else localStorage.setItem('app_password',document.getElementById('appPassword').value);
});
document.getElementById('token')?.addEventListener('change',()=>{
  if(document.getElementById('rememberToken').checked){
    localStorage.setItem('jira_token',document.getElementById('token').value);
  }
});
document.getElementById('rememberToken')?.addEventListener('change',function(){
  if(!this.checked){localStorage.removeItem('jira_token');}
  else{localStorage.setItem('jira_token',document.getElementById('token').value);}
});
</script>
